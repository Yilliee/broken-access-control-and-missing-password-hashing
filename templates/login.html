{% extends "base.html" %}
{% block title %}Login – VulnDemo{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-header">
        <h4 class="mb-0">Log In</h4>
      </div>
      <div class="card-body">

        <div class="alert alert-warning py-2 mb-3">
          <strong>Default accounts:</strong><br />
          <code>admin</code> / <code>adminpass</code> &nbsp;|&nbsp;
          <code>alice</code> / <code>alice1234</code> &nbsp;|&nbsp;
          <code>bob</code> / <code>bobsecret</code>
        </div>

        <form method="post" action="{{ url_for('login') }}">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username" required />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required />
          </div>
          <button type="submit" class="btn btn-primary w-100">Log In</button>
        </form>

        <hr />
        <p class="text-center mb-0">
          No account yet? <a href="{{ url_for('register') }}">Register</a>
        </p>

      </div>
    </div>
  </div>
</div>
{% endblock %}
